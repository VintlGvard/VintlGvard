<svg width="900" height="176" viewBox="0 0 900 176" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VintlGvard GitHub stats">
<title>VintlGvard GitHub stats</title>
<defs>
<style>.sans{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace}.text{fill:#E8EEF4}.muted{fill:#8B95A5}.dim{fill:#5B6472}.accent{fill:#00E5CC}.rise{opacity:1;animation:rise .72s cubic-bezier(.22,.9,.3,1.05) both}.fadeup{opacity:1;animation:fadeup .58s cubic-bezier(.22,.9,.3,1.05) both}.pulse{opacity:1;animation:pulse 2.2s ease-in-out infinite}.flow{stroke-dasharray:7 9;animation:flow 1.35s linear infinite}.blink{opacity:1;animation:blink 1s step-end infinite}.floaty{animation:floaty 4.8s ease-in-out infinite alternate}.spin{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}.stageglow{opacity:1;animation:stageglow 2.6s ease-in-out infinite}.breathe{animation:breathe 3.4s ease-in-out infinite}@keyframes rise{from{opacity:.01;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeup{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes blink{0%,47%{opacity:1}48%,100%{opacity:.08}}@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-4px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes stageglow{0%,100%{opacity:.42}50%{opacity:1}}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.rise,.fadeup,.pulse,.flow,.blink,.floaty,.spin,.stageglow,.breathe{animation:none!important}.motion-dot{display:none}}</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#121925"/><stop offset="1" stop-color="#0B1017"/>
</linearGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#18212E"/><stop offset="1" stop-color="#111720"/>
</linearGradient>
<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5CC"/><stop offset="1" stop-color="#7C5CFF"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#E8EEF4"/><stop offset="1" stop-color="#00E5CC" stop-opacity=".75"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
</pattern>

<clipPath id="clip-outer"><rect width="900" height="176" rx="24"/></clipPath>
<clipPath id="clip-stats"><rect x="12" y="8" width="876" height="168" rx="20"/></clipPath>
</defs>
<rect width="900" height="176" rx="24" fill="#07090D"/>
<g clip-path="url(#clip-outer)">
<rect width="900" height="176" rx="24" fill="url(#grid)"/>
<ellipse cx="128" cy="8" rx="280" ry="112" fill="#00E5CC" opacity=".09"/>
<ellipse cx="820" cy="168" rx="264" ry="120" fill="#7C5CFF" opacity=".07"/>
</g>
<rect x=".5" y=".5" width="899" height="175" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
<g class="rise">
  <rect x="12" y="8" width="876" height="168" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity=".12"/>
  <path d="M12 28a20 20 0 0 1 20-20h836a20 20 0 0 1 20 20v20H12z" fill="url(#headGrad)"/>
  <circle cx="36" cy="28" r="4" fill="#FF5F56"/>
  <circle cx="52" cy="28" r="4" fill="#FFBD2E"/>
  <circle class="pulse" cx="68" cy="28" r="4" fill="#27C93F"/>
  <text class="mono muted" x="450" y="32" font-size="10" text-anchor="middle"><tspan fill="#00E5CC">//</tspan> telemetry / five signals</text>
  <g clip-path="url(#clip-stats)">
  
<g class="floaty fadeup" style="animation-delay:0.08s">
  <rect x="48" y="76" width="148" height="80" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text class="sans text" x="64" y="106" font-size="23" font-weight="800">12</text>
  <rect class="breathe" style="animation-delay:0.50s" x="64" y="114" width="5" height="2" rx="1" fill="url(#accentGrad)">
    <animate attributeName="width" from="5" to="52" dur=".7s" begin="0.18s" fill="freeze"/>
  </rect>
  <text class="mono" x="64" y="134" font-size="9" fill="#00E5CC">REPOS</text>
  <text class="mono muted" x="64" y="147" font-size="9">public</text>
</g>
<g class="floaty fadeup" style="animation-delay:0.17s">
  <rect x="208" y="76" width="148" height="80" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text class="sans text" x="224" y="106" font-size="23" font-weight="800">7</text>
  <rect class="breathe" style="animation-delay:0.70s" x="224" y="114" width="5" height="2" rx="1" fill="url(#accentGrad)">
    <animate attributeName="width" from="5" to="52" dur=".7s" begin="0.27s" fill="freeze"/>
  </rect>
  <text class="mono" x="224" y="134" font-size="9" fill="#00E5CC">STARS</text>
  <text class="mono muted" x="224" y="147" font-size="9">total</text>
</g>
<g class="floaty fadeup" style="animation-delay:0.26s">
  <rect x="368" y="76" width="148" height="80" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text class="sans text" x="384" y="106" font-size="23" font-weight="800">1</text>
  <rect class="breathe" style="animation-delay:0.90s" x="384" y="114" width="5" height="2" rx="1" fill="url(#accentGrad)">
    <animate attributeName="width" from="5" to="52" dur=".7s" begin="0.36s" fill="freeze"/>
  </rect>
  <text class="mono" x="384" y="134" font-size="9" fill="#00E5CC">FOLLOWERS</text>
  <text class="mono muted" x="384" y="147" font-size="9">github</text>
</g>
<g class="floaty fadeup" style="animation-delay:0.35s">
  <rect x="528" y="76" width="148" height="80" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text class="sans text" x="544" y="106" font-size="23" font-weight="800">6</text>
  <rect class="breathe" style="animation-delay:1.10s" x="544" y="114" width="5" height="2" rx="1" fill="url(#accentGrad)">
    <animate attributeName="width" from="5" to="52" dur=".7s" begin="0.45s" fill="freeze"/>
  </rect>
  <text class="mono" x="544" y="134" font-size="9" fill="#00E5CC">LIVE</text>
  <text class="mono muted" x="544" y="147" font-size="9">non-archived</text>
</g>
<g class="floaty fadeup" style="animation-delay:0.44s">
  <rect x="688" y="76" width="148" height="80" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text class="sans text" x="704" y="106" font-size="23" font-weight="800">&lt;24h</text>
  <rect class="breathe" style="animation-delay:1.30s" x="704" y="114" width="5" height="2" rx="1" fill="#38D996">
    <animate attributeName="width" from="5" to="52" dur=".7s" begin="0.54s" fill="freeze"/>
  </rect>
  <text class="mono" x="704" y="134" font-size="9" fill="#00E5CC">REPLY</text>
  <text class="mono muted" x="704" y="147" font-size="9">open to work</text>
</g>
  </g>
</g>
</svg>