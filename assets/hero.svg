<svg width="900" height="238" viewBox="0 0 900 238" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VintlGvard — Fullstack product engineer">
<title>VintlGvard — Fullstack product engineer</title>
<defs>
<style>.sans{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace}.text{fill:#E8EEF4}.muted{fill:#8B95A5}.dim{fill:#5B6472}.accent{fill:#00E5CC}.rise{opacity:1;animation:rise .72s cubic-bezier(.22,.9,.3,1.05) both}.fadeup{opacity:1;animation:fadeup .58s cubic-bezier(.22,.9,.3,1.05) both}.pulse{opacity:1;animation:pulse 2.2s ease-in-out infinite}.flow{stroke-dasharray:7 9;animation:flow 1.35s linear infinite}.blink{opacity:1;animation:blink 1s step-end infinite}.floaty{animation:floaty 4.8s ease-in-out infinite alternate}.spin{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}.stageglow{opacity:1;animation:stageglow 2.6s ease-in-out infinite}.breathe{animation:breathe 3.4s ease-in-out infinite}@keyframes rise{from{opacity:.01;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeup{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes blink{0%,47%{opacity:1}48%,100%{opacity:.08}}@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-4px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes stageglow{0%,100%{opacity:.42}50%{opacity:1}}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.rise,.fadeup,.pulse,.flow,.blink,.floaty,.spin,.stageglow,.breathe{animation:none!important}.motion-dot{display:none}}</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#121925"/><stop offset="1" stop-color="#0B1017"/>
</linearGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#18212E"/><stop offset="1" stop-color="#111720"/>
</linearGradient>
<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5CC"/><stop offset="1" stop-color="#7C5CFF"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#E8EEF4"/><stop offset="1" stop-color="#00E5CC" stop-opacity=".75"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
</pattern>

<clipPath id="typeClip"><rect x="48" y="151" width="0" height="24">
<animate attributeName="width" from="0" to="248" dur="1.4s" begin="0.45s" fill="freeze"/>
</rect></clipPath>
<clipPath id="bioClip"><rect x="48" y="126" width="560" height="20"/></clipPath>

<clipPath id="clip-outer"><rect width="900" height="238" rx="24"/></clipPath>
<clipPath id="clip-hero"><rect x="12" y="8" width="876" height="230" rx="20"/></clipPath>
</defs>
<rect width="900" height="238" rx="24" fill="#07090D"/>
<g clip-path="url(#clip-outer)">
<rect width="900" height="238" rx="24" fill="url(#grid)"/>
<ellipse cx="128" cy="8" rx="280" ry="112" fill="#00E5CC" opacity=".09"/>
<ellipse cx="820" cy="230" rx="264" ry="120" fill="#7C5CFF" opacity=".07"/>
</g>
<rect x=".5" y=".5" width="899" height="237" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
<g class="rise">
  <rect x="12" y="8" width="876" height="230" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity=".12"/>
  <path d="M12 28a20 20 0 0 1 20-20h836a20 20 0 0 1 20 20v20H12z" fill="url(#headGrad)"/>
  <circle cx="36" cy="28" r="4" fill="#FF5F56"/>
  <circle cx="52" cy="28" r="4" fill="#FFBD2E"/>
  <circle class="pulse" cx="68" cy="28" r="4" fill="#27C93F"/>
  <text class="mono muted" x="450" y="32" font-size="10" text-anchor="middle"><tspan fill="#00E5CC">//</tspan> identity / mission control</text>
  <g clip-path="url(#clip-hero)">
  
<g class="fadeup" style="animation-delay:.08s">
  <text class="sans" x="48" y="104" font-size="34" font-weight="800" letter-spacing="-.8" fill="url(#nameGrad)">VintlGvard</text>
  <rect x="48" y="116" width="8" height="3" rx="1.5" fill="url(#accentGrad)">
    <animate attributeName="width" from="8" to="232" dur="0.9s" begin="0.18s" fill="freeze"/>
  </rect>
</g>
<g clip-path="url(#bioClip)">
  <text class="sans muted fadeup" x="48" y="142" font-size="12.5" style="animation-delay:.16s">Fullstack product engineer • TypeScript + Go • shipping ideas to production</text>
</g>
<g clip-path="url(#typeClip)">
  <text class="mono text" x="48" y="172" font-size="12">❯ whoami → Vitaliy</text>
</g>
<rect class="blink" x="184" y="159" width="7" height="15" rx="1" fill="#00E5CC"/>
<g class="fadeup" style="animation-delay:.28s">
  <rect x="48" y="190" width="408" height="32" rx="16" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text class="mono" x="64" y="210" font-size="10" fill="#00E5CC">12 REPOS</text>
  <line x1="136" y1="198" x2="136" y2="214" stroke="#FFFFFF" stroke-opacity=".14"/>
  <text class="mono text" x="152" y="210" font-size="10">★ 7</text>
  <line x1="204" y1="198" x2="204" y2="214" stroke="#FFFFFF" stroke-opacity=".14"/>
  <text class="mono text" x="220" y="210" font-size="10">1 FOLLOWERS</text>
  <line x1="312" y1="198" x2="312" y2="214" stroke="#FFFFFF" stroke-opacity=".14"/>
  <text class="mono muted" x="328" y="210" font-size="9.5">TypeScript + Go</text>
</g>
<g class="fadeup" style="animation-delay:.2s">
  <circle cx="808" cy="110" r="30" fill="#0B1017" stroke="#FFFFFF" stroke-opacity=".1"/>
  <circle class="spin" cx="808" cy="110" r="25" fill="none" stroke="url(#accentGrad)" stroke-width="1.6" stroke-dasharray="11 8" opacity=".78"/>
  <text class="mono" x="808" y="117" font-size="18" font-weight="700" text-anchor="middle" fill="#00E5CC">❯</text>
  <circle class="pulse" cx="680" cy="110" r="5" fill="#38D996"/>
  <text class="mono" x="692" y="114" font-size="9.5" fill="#E8EEF4">OPEN TO WORK</text>
  <text class="mono muted" x="680" y="134" font-size="9">reply &lt; 24h</text>
</g>
<g class="floaty fadeup" style="animation-delay:.32s">
  <rect x="680" y="166" width="172" height="40" rx="20" fill="url(#accentGrad)"/>
  <text class="mono" x="766" y="191" font-size="11" font-weight="800" text-anchor="middle" fill="#041916">vintlgvard.com</text>
</g>

  </g>
</g>
</svg>