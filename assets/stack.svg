<svg width="900" height="232" viewBox="0 0 900 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VintlGvard languages">
<title>VintlGvard languages</title>
<defs>
<style>.sans{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace}.text{fill:#E8EEF4}.muted{fill:#8B95A5}.dim{fill:#5B6472}.accent{fill:#00E5CC}.rise{opacity:1;animation:rise .72s cubic-bezier(.22,.9,.3,1.05) both}.fadeup{opacity:1;animation:fadeup .58s cubic-bezier(.22,.9,.3,1.05) both}.pulse{opacity:1;animation:pulse 2.2s ease-in-out infinite}.flow{stroke-dasharray:7 9;animation:flow 1.35s linear infinite}.blink{opacity:1;animation:blink 1s step-end infinite}.floaty{animation:floaty 4.8s ease-in-out infinite alternate}.spin{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}.stageglow{opacity:1;animation:stageglow 2.6s ease-in-out infinite}.breathe{animation:breathe 3.4s ease-in-out infinite}@keyframes rise{from{opacity:.01;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeup{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes blink{0%,47%{opacity:1}48%,100%{opacity:.08}}@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-4px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes stageglow{0%,100%{opacity:.42}50%{opacity:1}}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.rise,.fadeup,.pulse,.flow,.blink,.floaty,.spin,.stageglow,.breathe{animation:none!important}.motion-dot{display:none}}</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#121925"/><stop offset="1" stop-color="#0B1017"/>
</linearGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#18212E"/><stop offset="1" stop-color="#111720"/>
</linearGradient>
<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5CC"/><stop offset="1" stop-color="#7C5CFF"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#E8EEF4"/><stop offset="1" stop-color="#00E5CC" stop-opacity=".75"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
</pattern>

<clipPath id="clip-outer"><rect width="900" height="232" rx="24"/></clipPath>
<clipPath id="clip-stack"><rect x="12" y="8" width="876" height="224" rx="20"/></clipPath>
</defs>
<rect width="900" height="232" rx="24" fill="#07090D"/>
<g clip-path="url(#clip-outer)">
<rect width="900" height="232" rx="24" fill="url(#grid)"/>
<ellipse cx="128" cy="8" rx="280" ry="112" fill="#00E5CC" opacity=".09"/>
<ellipse cx="820" cy="224" rx="264" ry="120" fill="#7C5CFF" opacity=".07"/>
</g>
<rect x=".5" y=".5" width="899" height="231" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
<g class="rise">
  <rect x="12" y="8" width="876" height="224" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity=".12"/>
  <path d="M12 28a20 20 0 0 1 20-20h836a20 20 0 0 1 20 20v20H12z" fill="url(#headGrad)"/>
  <circle cx="36" cy="28" r="4" fill="#FF5F56"/>
  <circle cx="52" cy="28" r="4" fill="#FFBD2E"/>
  <circle class="pulse" cx="68" cy="28" r="4" fill="#27C93F"/>
  <text class="mono muted" x="450" y="32" font-size="10" text-anchor="middle"><tspan fill="#00E5CC">//</tspan> languages / most used</text>
  <g clip-path="url(#clip-stack)">
  
<g class="fadeup" style="animation-delay:0.20s">
  <text class="sans" x="48" y="87" font-size="11" fill="#E8EEF4">TypeScript</text>
  <rect class="breathe" style="animation-delay:0.00s" x="200" y="78" width="512" height="10" rx="5" fill="#FFFFFF" fill-opacity=".1"/>
  <rect x="5" y="78" width="5" height="10" rx="5" fill="url(#accentGrad)" transform="translate(195 0)">
    <animate attributeName="width" from="5" to="314" dur="0.8s" begin="0.30s" fill="freeze"/>
  </rect>
  <text class="mono muted" x="852" y="87" font-size="9.5" text-anchor="end">61.3%</text>
</g>
<g class="fadeup" style="animation-delay:0.27s">
  <text class="sans" x="48" y="117" font-size="11" fill="#8B95A5">JavaScript</text>
  <rect class="breathe" style="animation-delay:0.30s" x="200" y="108" width="512" height="10" rx="5" fill="#FFFFFF" fill-opacity=".1"/>
  <rect x="5" y="108" width="5" height="10" rx="5" fill="#5B6472" transform="translate(195 0)">
    <animate attributeName="width" from="5" to="92" dur="0.8s" begin="0.37s" fill="freeze"/>
  </rect>
  <text class="mono muted" x="852" y="117" font-size="9.5" text-anchor="end">18.0%</text>
</g>
<g class="fadeup" style="animation-delay:0.34s">
  <text class="sans" x="48" y="147" font-size="11" fill="#8B95A5">Python</text>
  <rect class="breathe" style="animation-delay:0.60s" x="200" y="138" width="512" height="10" rx="5" fill="#FFFFFF" fill-opacity=".1"/>
  <rect x="5" y="138" width="5" height="10" rx="5" fill="#5B6472" transform="translate(195 0)">
    <animate attributeName="width" from="5" to="48" dur="0.8s" begin="0.44s" fill="freeze"/>
  </rect>
  <text class="mono muted" x="852" y="147" font-size="9.5" text-anchor="end">9.4%</text>
</g>
<g class="fadeup" style="animation-delay:0.41s">
  <text class="sans" x="48" y="177" font-size="11" fill="#8B95A5">CSS</text>
  <rect class="breathe" style="animation-delay:0.90s" x="200" y="168" width="512" height="10" rx="5" fill="#FFFFFF" fill-opacity=".1"/>
  <rect x="5" y="168" width="5" height="10" rx="5" fill="#5B6472" transform="translate(195 0)">
    <animate attributeName="width" from="5" to="48" dur="0.8s" begin="0.51s" fill="freeze"/>
  </rect>
  <text class="mono muted" x="852" y="177" font-size="9.5" text-anchor="end">9.3%</text>
</g>
<g class="fadeup" style="animation-delay:0.48s">
  <text class="sans" x="48" y="207" font-size="11" fill="#8B95A5">HTML</text>
  <rect class="breathe" style="animation-delay:1.20s" x="200" y="198" width="512" height="10" rx="5" fill="#FFFFFF" fill-opacity=".1"/>
  <rect x="5" y="198" width="5" height="10" rx="5" fill="#5B6472" transform="translate(195 0)">
    <animate attributeName="width" from="5" to="5" dur="0.8s" begin="0.58s" fill="freeze"/>
  </rect>
  <text class="mono muted" x="852" y="207" font-size="9.5" text-anchor="end">1.0%</text>
</g>
  </g>
</g>
</svg>